<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><title>Sora · 动态立绘</title>
<link rel="stylesheet" href="live.css">
</head><body>
<main>
  <div class="stage" id="stage">
    <img id="portrait" src="sora.webp" alt="Sora 扎着银白色高马尾，蓝眼睛微微含笑，抬手向你问好。">
    <canvas id="live" aria-hidden="true"></canvas>
  </div>
  <nav aria-label="与 Sora 互动">
    <button id="greet" type="button" title="向 Sora 招手" aria-label="向 Sora 招手"><svg viewBox="0 0 24 24"><path d="m5.3 12.6 1.4 1.8-2.6-6q-.6-1.5.5-2 1.2-.5 1.8.9l2.1 4.2-2-7q-.4-1.4.8-1.7 1.2-.3 1.6.9l2.3 6.8-1.1-7q-.2-1.4 1-1.6 1.2-.1 1.4 1.3l1.2 7 .1-5.6q0-1.2 1.2-1.3 1.2.1 1.2 1.3l.3 8.4 1.6-2.8q.7-1.2 1.7-.7.9.5.4 1.8l-2.7 6.5c-1.8 4.3-7.1 4.4-9.9 1.2L3.6 14q-.8-1.2.1-1.8.8-.6 1.6.4Z"/></svg></button>
    <button id="music" type="button" title="听 Sora 弹一句旋律" aria-label="听 Sora 弹一句旋律"><svg viewBox="0 0 24 24"><path d="M9 17.5V6l11-2v11.5M9 9l11-2"/><ellipse cx="6.5" cy="18" rx="2.8" ry="2"/><ellipse cx="17.5" cy="16" rx="2.8" ry="2"/></svg></button>
    <button id="pause" type="button" title="暂停动态" aria-label="暂停动态" aria-pressed="false"><svg viewBox="0 0 24 24"><path class="pause-icon" d="M8 5v14m8-14v14"/><path class="play-icon" d="m8 5 11 7-11 7Z"/></svg></button>
  </nav>
  <span class="sr-only" aria-live="polite" id="status"></span>
</main>
<script type="module" src="live.js"></script>
</body></html>
