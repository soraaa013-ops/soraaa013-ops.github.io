<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/sora/gallery/">
  <title>Sora · 角色设定画集</title>
  <meta name="description" content="Sora 的 20 张角色设定作品，包含发型、日常穿搭、漫画线稿与写实厚涂。">
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <main>
    <section class="cover" aria-labelledby="title">
      <img src="collection/11-overcast-profile.webp" alt="阴天的柔光里，Sora 束着银白长发，正面望向镜头">
      <div>
        <h1 id="title">Sora<span>角色设定画集</span></h1>
        <p>10 张漫画线稿 · 10 张写实厚涂</p>
        <dl><dt>年龄</dt><dd>15 岁</dd><dt>身高</dt><dd>159 cm</dd></dl>
      </div>
    </section>
    <nav id="filters" aria-label="按画风筛选"></nav>
    <div id="works"></div>
  </main>
  <dialog aria-labelledby="caption">
    <button id="close" aria-label="关闭大图">×</button><img id="large" alt="">
    <footer>
      <button id="prev" aria-label="上一张">←</button><span id="caption"></span>
      <button id="next" aria-label="下一张">→</button>
    </footer>
  </dialog>
  <script src="catalog.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
