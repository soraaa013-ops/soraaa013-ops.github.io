<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>节拍器 · Sora</title>
  <meta name="description" content="一个精确、好用的在线节拍器 — 变速、拍号、每拍音符、重音、打拍定速" />
  <meta name="theme-color" content="#f6f7f9" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎚️</text></svg>" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="back" href="../">← 返回主页</a>
      <span class="brand"><span class="dot"></span>节拍器 · METRONOME</span>
    </div>
  </header>

  <main class="app">
    <section class="stage">
      <p class="tempo-mark" id="tempoMark">Moderato · 中板</p>

      <div class="metronome" aria-hidden="true">
        <div class="m-case"></div>
        <div class="m-ticks"></div>
        <div class="m-rod" id="mRod">
          <span class="m-weight" id="mWeight"></span>
        </div>
        <span class="m-pivot"></span>
      </div>

      <div class="beats" id="beats" aria-hidden="true"></div>

      <div class="bpm-block">
        <div class="bpm-row">
          <button class="step" id="minusBtn" type="button" aria-label="速度减一">−</button>
          <div class="bpm-display">
            <input class="bpm-input" id="bpmInput" type="text" inputmode="numeric" role="spinbutton"
                   aria-label="速度 BPM" aria-valuemin="30" aria-valuemax="300" value="120" />
            <span class="bpm-unit">BPM</span>
          </div>
          <button class="step" id="plusBtn" type="button" aria-label="速度加一">+</button>
        </div>
        <input class="range" id="bpmSlider" type="range" min="30" max="300" step="1" value="120" aria-label="速度滑块" />
      </div>

      <div class="transport">
        <button class="play" id="playBtn" type="button" aria-label="开始" aria-pressed="false">
          <span class="play-icon" id="playIcon" aria-hidden="true"></span>
        </button>
        <button class="tap" id="tapBtn" type="button" aria-label="打拍定速">
          <span>TAP</span><small>打拍定速</small>
        </button>
      </div>
    </section>

    <div class="panel">
      <section class="field">
        <h3>拍号 <span class="field-sub">每小节拍数</span></h3>
        <div class="seg sig" id="sigSeg" role="radiogroup" aria-label="拍号"></div>
        <div class="custom-row">
          <span>自定义</span>
          <div class="stepper">
            <button class="mini" id="custMinus" type="button" aria-label="拍数减一">−</button>
            <span class="stepper-val"><span id="custVal">4</span><small>拍</small></span>
            <button class="mini" id="custPlus" type="button" aria-label="拍数加一">+</button>
          </div>
        </div>
      </section>

      <section class="field">
        <h3>每拍音符 <span class="field-sub">拍点疏密</span></h3>
        <div class="seg" id="subdivSeg" role="radiogroup" aria-label="每拍音符"></div>
      </section>

      <section class="field">
        <h3>音色 <span class="field-sub">合成音源</span></h3>
        <div class="seg" id="timbreSeg" role="radiogroup" aria-label="音色"></div>
      </section>

      <section class="field">
        <h3>重音与音量</h3>
        <div class="switch-row">
          <span>第一拍重音</span>
          <button class="switch" id="accentSwitch" type="button" role="switch" aria-checked="true" aria-label="重音开关"><i></i></button>
        </div>
        <div class="vol-row">
          <span>音量</span>
          <input class="range" id="volSlider" type="range" min="0" max="100" step="1" value="80" aria-label="音量" />
        </div>
      </section>
    </div>
  </main>

  <p class="hint">
    <kbd>空格</kbd> 开始/停止 · <kbd>↑↓</kbd> 调速 · <kbd>T</kbd> 打拍 · <kbd>M</kbd> 静音 ·
    首次使用先点一下「播放」或「TAP」以启用声音
  </p>

  <footer>
    <p>© <span id="year"></span> Sora · Metronome · <a href="../">返回主页</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
