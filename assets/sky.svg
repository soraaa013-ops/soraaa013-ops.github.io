<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe3f2"/>
      <stop offset="40%" stop-color="#ffeaf7"/>
      <stop offset="70%" stop-color="#f3e7ff"/>
      <stop offset="100%" stop-color="#e4f4ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff4c2" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffd6ea" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffd6ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffe6f4" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1220" cy="200" r="260" fill="url(#sun)"/>
  <circle cx="1220" cy="200" r="86" fill="#fff6d8" opacity="0.85"/>

  <!-- far clouds -->
  <g opacity="0.75">
    <ellipse cx="300" cy="220" rx="150" ry="52" fill="url(#cloud)"/>
    <ellipse cx="420" cy="200" rx="110" ry="44" fill="url(#cloud)"/>
    <ellipse cx="200" cy="235" rx="90" ry="38" fill="url(#cloud)"/>
  </g>
  <g opacity="0.65">
    <ellipse cx="1150" cy="430" rx="170" ry="56" fill="url(#cloud)"/>
    <ellipse cx="1300" cy="410" rx="120" ry="44" fill="url(#cloud)"/>
    <ellipse cx="1040" cy="445" rx="100" ry="40" fill="url(#cloud)"/>
  </g>
  <g opacity="0.55">
    <ellipse cx="650" cy="640" rx="200" ry="62" fill="url(#cloud)"/>
    <ellipse cx="820" cy="620" rx="140" ry="48" fill="url(#cloud)"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffb3d9">
    <path d="M480 140 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" opacity="0.9"/>
    <path d="M900 120 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4z" opacity="0.8"/>
    <path d="M1420 520 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z" opacity="0.75"/>
    <path d="M240 560 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4z" opacity="0.7"/>
  </g>
  <g fill="#b996ff">
    <path d="M1080 300 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z" opacity="0.7"/>
    <path d="M600 460 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4z" opacity="0.6"/>
  </g>
</svg>
