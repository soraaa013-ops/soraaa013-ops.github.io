<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb3d9"/>
      <stop offset="55%" stop-color="#ff8fc7"/>
      <stop offset="100%" stop-color="#e77fb4"/>
    </linearGradient>
    <linearGradient id="hairShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0f8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff0f8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2ea"/>
      <stop offset="100%" stop-color="#ffe0d2"/>
    </linearGradient>
    <linearGradient id="uniform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#8fe3ff"/>
      <stop offset="55%" stop-color="#5aa9ff"/>
      <stop offset="100%" stop-color="#4a6fd6"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#ff8fc7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#soft)">
    <!-- back hair -->
    <path d="M200 44
             C 96 44 66 132 70 214
             C 72 268 60 320 46 372
             C 90 356 108 344 118 330
             C 108 300 104 268 108 240
             L 292 240
             C 296 268 292 300 282 330
             C 292 344 310 356 354 372
             C 340 320 328 268 330 214
             C 334 132 304 44 200 44 Z"
          fill="url(#hair)"/>

    <!-- twin tails -->
    <path d="M78 220 C 40 250 30 320 44 400 C 74 392 96 356 100 312 C 104 274 100 244 96 224 Z"
          fill="url(#hair)"/>
    <path d="M322 220 C 360 250 370 320 356 400 C 326 392 304 356 300 312 C 296 274 300 244 304 224 Z"
          fill="url(#hair)"/>

    <!-- neck -->
    <path d="M170 300 L170 340 L230 340 L230 300 Z" fill="url(#skin)"/>

    <!-- uniform / shoulders -->
    <path d="M200 336
             C 150 336 104 372 88 432
             C 82 460 80 486 80 512
             L 320 512
             C 320 486 318 460 312 432
             C 296 372 250 336 200 336 Z"
          fill="url(#uniform)"/>
    <!-- sailor collar -->
    <path d="M200 344 L120 400 L150 410 L200 372 L250 410 L280 400 Z" fill="#c9e0ff" opacity="0.9"/>
    <path d="M200 372 L200 512" stroke="#dbe7ff" stroke-width="3"/>
    <!-- ribbon -->
    <path d="M200 420 L172 402 L166 428 L194 440 Z" fill="#ff8fc7"/>
    <path d="M200 420 L228 402 L234 428 L206 440 Z" fill="#ff8fc7"/>
    <circle cx="200" cy="424" r="10" fill="#ff6fb5"/>

    <!-- face -->
    <ellipse cx="200" cy="212" rx="104" ry="116" fill="url(#skin)"/>

    <!-- bangs -->
    <path d="M200 66
             C 118 66 92 130 96 200
             C 100 176 116 158 140 150
             C 150 178 168 194 200 196
             C 232 194 250 178 260 150
             C 284 158 300 176 304 200
             C 308 130 282 66 200 66 Z"
          fill="url(#hair)"/>
    <path d="M200 84 C 150 84 124 116 120 158 C 150 138 250 138 280 158 C 276 116 250 84 200 84 Z"
          fill="url(#hairShine)"/>

    <!-- side bangs -->
    <path d="M104 168 C 92 214 96 262 112 296 C 126 268 128 220 122 182 Z" fill="url(#hair)"/>
    <path d="M296 168 C 308 214 304 262 288 296 C 274 268 272 220 278 182 Z" fill="url(#hair)"/>

    <!-- eyebrows -->
    <path d="M148 190 C 160 182 178 182 188 188" stroke="#e77fb4" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M252 190 C 240 182 222 182 212 188" stroke="#e77fb4" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- eyes -->
    <g>
      <ellipse cx="158" cy="222" rx="26" ry="30" fill="#ffffff"/>
      <ellipse cx="242" cy="222" rx="26" ry="30" fill="#ffffff"/>
      <ellipse cx="160" cy="226" rx="20" ry="26" fill="url(#iris)"/>
      <ellipse cx="240" cy="226" rx="20" ry="26" fill="url(#iris)"/>
      <ellipse cx="160" cy="228" rx="9" ry="13" fill="#20304a"/>
      <ellipse cx="240" cy="228" rx="9" ry="13" fill="#20304a"/>
      <circle cx="152" cy="214" r="7" fill="#ffffff"/>
      <circle cx="232" cy="214" r="7" fill="#ffffff"/>
      <circle cx="168" cy="238" r="3.5" fill="#ffffff" opacity="0.85"/>
      <circle cx="248" cy="238" r="3.5" fill="#ffffff" opacity="0.85"/>
      <!-- upper lash -->
      <path d="M132 208 C 144 196 174 196 186 210" stroke="#5a3d52" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M268 208 C 256 196 226 196 214 210" stroke="#5a3d52" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- blush -->
    <ellipse cx="140" cy="256" rx="18" ry="10" fill="#ffa9cf" opacity="0.55"/>
    <ellipse cx="260" cy="256" rx="18" ry="10" fill="#ffa9cf" opacity="0.55"/>

    <!-- nose -->
    <path d="M200 244 l4 8 l-8 0 z" fill="#ffc4a8" opacity="0.7"/>

    <!-- mouth -->
    <path d="M188 272 C 196 282 204 282 212 272" stroke="#e06a8f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M192 274 C 198 280 202 280 208 274 Z" fill="#ff8fb0" opacity="0.6"/>

    <!-- hair pin -->
    <path d="M286 150 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7z" fill="#ffe066"/>
    <circle cx="286" cy="175" r="4" fill="#fff6c2"/>
  </g>
</svg>
